# models/custom_botsort.yaml

tracker_type: botsort
track_high_thresh: 0.5   # High confidence to start tracking
track_low_thresh: 0.1    # Keep lower conf in background
new_track_thresh: 0.8    # Strict: suppresses ghost tracks from reflections/oars
track_buffer: 90         # Keep lost tracks alive ~3s so brief dropouts re-associate
match_thresh: 0.8        # High = Lenient matching (helps with camera shake)
fuse_score: True         # Use confidence score in matching

# BoT-SORT specific
gmc_method: sparseOptFlow
# gmc_method: none       # Use 'none' if you get OpenCV errors, but flow is better

# ReID parameters (REQUIRED to be present, even if with_reid is False)
proximity_thresh: 0.5    # Spatial threshold
appearance_thresh: 0.25  # Appearance threshold
with_reid: False         # Disable ReID (uniforms confuse it anyway)
